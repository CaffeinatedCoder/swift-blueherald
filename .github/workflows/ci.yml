name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The package needs macOS 26, and CoreBluetooth only exists on macOS, so everything runs there.
# The tests use FakeCentral and ReplayCentral; CoreBluetoothCentral itself is checked by hand
# against a real peripheral with Scripts/hardware-smoke.swift (see AGENTS.md).
jobs:
  format:
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: swift --version
      - run: swift format lint --strict -r Sources Tests Scripts Package.swift

  test:
    name: test (${{ matrix.configuration }})
    runs-on: macos-26
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        configuration: [debug, release]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: swift --version
      - run: swift build -c ${{ matrix.configuration }}
      - run: swift test -c ${{ matrix.configuration }}

  thread-sanitizer:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: swift test --sanitize=thread
